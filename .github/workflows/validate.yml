name: Validate Modules

on:
  push:
    paths:
      - 'modules/**'
      - 'modules.json'
  pull_request:
    paths:
      - 'modules/**'
      - 'modules.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run validation
        run: python3 validate.py --ci

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <!-- Encryption Flow: Plaintext -> Key -> Ciphertext -->
  <rect x="20" y="60" width="140" height="80" rx="12" fill="#2D5A27" stroke="#4CAF50" stroke-width="2"/>
  <text x="90" y="95" text-anchor="middle" fill="#E0E0E0" font-size="14" font-weight="bold">Plaintext</text>
  <text x="90" y="115" text-anchor="middle" fill="#A0A0A0" font-size="11">"HELLO"</text>
  
  <line x1="165" y1="100" x2="210" y2="100" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <rect x="215" y="40" width="170" height="120" rx="8" fill="#1A237E" stroke="#3F51B5" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" fill="#7986CB" font-size="12">Algorithm</text>
  <text x="300" y="100" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">Caesar</text>
  <text x="300" y="120" text-anchor="middle" fill="#E0E0E0" font-size="16" font-weight="bold">Cipher</text>
  <text x="300" y="145" text-anchor="middle" fill="#FF8A65" font-size="12">Key = 3</text>
  
  <line x1="390" y1="100" x2="435" y2="100" stroke="#A0A0A0" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <rect x="440" y="60" width="140" height="80" rx="12" fill="#4A148C" stroke="#9C27B0" stroke-width="2"/>
  <text x="510" y="95" text-anchor="middle" fill="#E0E0E0" font-size="14" font-weight="bold">Ciphertext</text>
  <text x="510" y="115" text-anchor="middle" fill="#A0A0A0" font-size="11">"KHOOR"</text>
  
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#A0A0A0"/>
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#1A1A2E" rx="12"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#E0E0E0" font-size="18" font-weight="bold">Classical vs Modern Cryptography</text>
  <line x1="200" y1="45" x2="600" y2="45" stroke="#444466" stroke-width="1"/>

  <!-- Column headers -->
  <rect x="30" y="60" width="350" height="36" rx="8" fill="#BF360C" opacity="0.8"/>
  <text x="205" y="84" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">🏛️ Classical (Caesar Cipher)</text>

  <rect x="420" y="60" width="350" height="36" rx="8" fill="#2E7D32" opacity="0.8"/>
  <text x="595" y="84" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">🔒 Modern (AES-256)</text>

  <!-- ROW 1: Key Space -->
  <rect x="30" y="110" width="350" height="44" rx="6" fill="#3E2723" opacity="0.6"/>
  <text x="205" y="128" text-anchor="middle" fill="#FFAB91" font-size="12">Key Space</text>
  <text x="205" y="145" text-anchor="middle" fill="#FFCDD2" font-size="13" font-weight="bold">25 possible keys</text>

  <rect x="420" y="110" width="350" height="44" rx="6" fill="#1B5E20" opacity="0.6"/>
  <text x="595" y="128" text-anchor="middle" fill="#A5D6A7" font-size="12">Key Space</text>
  <text x="595" y="145" text-anchor="middle" fill="#C8E6C9" font-size="13" font-weight="bold">2²⁵⁶ possible keys</text>

  <!-- Arrow -->
  <text x="390" y="140" text-anchor="middle" fill="#888888" font-size="16">→</text>

  <!-- ROW 2: Operation -->
  <rect x="30" y="164" width="350" height="44" rx="6" fill="#3E2723" opacity="0.6"/>
  <text x="205" y="182" text-anchor="middle" fill="#FFAB91" font-size="12">Operation</text>
  <text x="205" y="199" text-anchor="middle" fill="#FFCDD2" font-size="13" font-weight="bold">Letter-by-letter substitution</text>

  <rect x="420" y="164" width="350" height="44" rx="6" fill="#1B5E20" opacity="0.6"/>
  <text x="595" y="182" text-anchor="middle" fill="#A5D6A7" font-size="12">Operation</text>
  <text x="595" y="199" text-anchor="middle" fill="#C8E6C9" font-size="13" font-weight="bold">16-byte block cipher + modes</text>

  <!-- Arrow -->
  <text x="390" y="194" text-anchor="middle" fill="#888888" font-size="16">→</text>

  <!-- ROW 3: Security -->
  <rect x="30" y="218" width="350" height="44" rx="6" fill="#3E2723" opacity="0.6"/>
  <text x="205" y="236" text-anchor="middle" fill="#FFAB91" font-size="12">Security Level</text>
  <text x="205" y="253" text-anchor="middle" fill="#EF9A9A" font-size="13" font-weight="bold">❌ Broken instantly</text>

  <rect x="420" y="218" width="350" height="44" rx="6" fill="#1B5E20" opacity="0.6"/>
  <text x="595" y="236" text-anchor="middle" fill="#A5D6A7" font-size="12">Security Level</text>
  <text x="595" y="253" text-anchor="middle" fill="#C8E6C9" font-size="13" font-weight="bold">✅ Secure (20+ years)</text>

  <!-- Arrow -->
  <text x="390" y="248" text-anchor="middle" fill="#888888" font-size="16">→</text>

  <!-- ROW 4: Cryptanalysis -->
  <rect x="30" y="272" width="350" height="44" rx="6" fill="#3E2723" opacity="0.6"/>
  <text x="205" y="290" text-anchor="middle" fill="#FFAB91" font-size="12">Cryptanalysis</text>
  <text x="205" y="307" text-anchor="middle" fill="#EF9A9A" font-size="13" font-weight="bold">Frequency analysis 🔍</text>

  <rect x="420" y="272" width="350" height="44" rx="6" fill="#1B5E20" opacity="0.6"/>
  <text x="595" y="290" text-anchor="middle" fill="#A5D6A7" font-size="12">Cryptanalysis</text>
  <text x="595" y="307" text-anchor="middle" fill="#C8E6C9" font-size="13" font-weight="bold">Brute force: 10¹⁸ years ⏳</text>

  <!-- Arrow -->
  <text x="390" y="302" text-anchor="middle" fill="#888888" font-size="16">→</text>

  <!-- Bottom tagline -->
  <rect x="250" y="322" width="300" height="22" rx="11" fill="#4A148C" opacity="0.7"/>
  <text x="400" y="338" text-anchor="middle" fill="#CE93D8" font-size="11">The evolution from 25 keys to 2²⁵⁶ changed everything</text>
</svg>

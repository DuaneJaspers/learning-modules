<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e" />

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e94560" font-size="28" font-family="Arial, sans-serif" font-weight="bold">Media Bias Spectrum</text>

  <!-- Spectrum -->
  <g>
    <!-- Left Bias -->
    <rect x="50" y="100" width="150" height="200" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2" />
    <text x="125" y="130" text-anchor="middle" fill="white" font-size="18" font-family="Arial, sans-serif" font-weight="bold">Left Bias</text>
    <text x="125" y="150" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">Emphasizes:</text>
    <text x="125" y="170" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Social justice</text>
    <text x="125" y="190" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Progressive policies</text>
    <text x="125" y="210" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Government intervention</text>
    <text x="125" y="240" text-anchor="middle" fill="#e94560" font-size="12" font-family="Arial, sans-serif">Example: The Guardian</text>

    <!-- Center -->
    <rect x="250" y="100" width="150" height="200" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2" />
    <text x="325" y="130" text-anchor="middle" fill="white" font-size="18" font-family="Arial, sans-serif" font-weight="bold">Center</text>
    <text x="325" y="150" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">Emphasizes:</text>
    <text x="325" y="170" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Balanced reporting</text>
    <text x="325" y="190" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Fact-based analysis</text>
    <text x="325" y="210" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Neutral language</text>
    <text x="325" y="240" text-anchor="middle" fill="#e94560" font-size="12" font-family="Arial, sans-serif">Example: BBC, Reuters</text>

    <!-- Right Bias -->
    <rect x="450" y="100" width="150" height="200" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2" />
    <text x="525" y="130" text-anchor="middle" fill="white" font-size="18" font-family="Arial, sans-serif" font-weight="bold">Right Bias</text>
    <text x="525" y="150" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">Emphasizes:</text>
    <text x="525" y="170" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Free markets</text>
    <text x="525" y="190" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Conservative values</text>
    <text x="525" y="210" text-anchor="middle" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">- Limited government</text>
    <text x="525" y="240" text-anchor="middle" fill="#e94560" font-size="12" font-family="Arial, sans-serif">Example: Fox News</text>

    <!-- Extreme Left -->
    <rect x="650" y="100" width="100" height="90" rx="10" fill="#e94560" stroke="#e94560" stroke-width="2" />
    <text x="700" y="130" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Extreme Left</text>
    <text x="700" y="150" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">Propaganda</text>
    <text x="700" y="170" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">Misinformation</text>

    <!-- Extreme Right -->
    <rect x="650" y="210" width="100" height="90" rx="10" fill="#e94560" stroke="#e94560" stroke-width="2" />
    <text x="700" y="240" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Extreme Right</text>
    <text x="700" y="260" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">Propaganda</text>
    <text x="700" y="280" text-anchor="middle" fill="white" font-size="10" font-family="Arial, sans-serif">Misinformation</text>
  </g>

  <!-- Legend -->
  <rect x="50" y="320" width="700" height="60" rx="10" fill="#0f3460" stroke="#e94560" stroke-width="2" />
  <text x="80" y="345" text-anchor="start" fill="white" font-size="14" font-family="Arial, sans-serif">Media Bias Spectrum: Evaluating news sources for political leanings and reliability.</text>
  <text x="80" y="365" text-anchor="start" fill="#a5a5a5" font-size="12" font-family="Arial, sans-serif">Use tools like Ad Fontes Media or Media Bias/Fact Check to assess sources.</text>
</svg>